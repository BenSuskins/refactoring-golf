plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.1.10'
}

version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    testImplementation 'com.natpryce:hamkrest:1.8.0.1'
}

test {
    useJUnitPlatform()
}

kotlin {
    jvmToolchain(17)
}